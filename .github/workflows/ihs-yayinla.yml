# main dalına gelen her değişikliği İHS hostinge (Plesk, httpdocs) FTP ile yükler.
# Gerekli GitHub "Secrets": FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# İsteğe bağlı "Variables": FTP_DIR (varsayılan: httpdocs)
# Sunucudaki fazla dosyalar (ör. eski WordPress) SİLİNMEZ; yalnızca bu depodaki dosyalar yüklenir.
name: İHS'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ihs-yayin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: lftp kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: FTP ile yükle
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || 'httpdocs' }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set net:max-retries 4;
            set net:reconnect-interval-base 5;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=2 \
              --exclude-glob .git* --exclude-glob .git/ --exclude-glob .github/ \
              --exclude-glob README.md --exclude-glob CNAME --exclude-glob .nojekyll \
              ./ $FTP_DIR/;
            bye"
